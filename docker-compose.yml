version: '3.8'

services:
  frontend:
    build:
      context: ./my-next-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./my-next-app:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run start:dev
